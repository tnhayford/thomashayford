log_format site_combined '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent"';

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    include /etc/nginx/gsc-redirects.conf;

    access_log /var/log/nginx/access.log site_combined;
    error_log /var/log/nginx/error.log warn;

    real_ip_header X-Real-IP;
    real_ip_recursive on;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;

    if ($host = www.thomashayford.site) {
        return 301 https://thomashayford.site$request_uri;
    }

    # Legacy taxonomy redirect.
    rewrite ^/journal/professional/?$ /journal/business/ permanent;
    rewrite ^/journal/professional/(.*)$ /journal/business/$1 permanent;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Retired public identity and publishing routes should leave search indexes.
    location = /cv.html { return 410; }
    location = /story { return 410; }
    location = /story/ { return 410; }
    location = /now { return 410; }
    location = /now/ { return 410; }
    location = /linkedin-highlights { return 410; }
    location = /linkedin-highlights/ { return 410; }
    location = /journal { return 410; }
    location ^~ /journal/ { return 410; }

    # The previous social card named a retired affiliation and was cached.
    location = /og-image.svg {
        return 410;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
        # Always revalidate HTML routes so page content updates immediately.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Reduce common favicon 404s from bots and browsers.
    location = /favicon.ico {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location = /favicon.png {
        try_files /assets/thomas-hayford-profile.png =404;
        expires 30d;
        access_log off;
    }

    # Machine-readable entity files should be crawlable but not indexed as pages.
    location ~ ^/entity/.*\.json$ {
        try_files $uri =404;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # Keep crawl-control files fresh for search engines.
    location = /robots.txt {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location = /feed.xml {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # Detailed CV files and attachments should leave public indexes.
    location ^~ /files/ {
        return 410;
    }

    # Internal scaffolding should not be publicly indexed or visited.
    location ^~ /journal/templates/ {
        return 404;
    }

    location ~* \.(css|js|svg|ico|xml|txt|webmanifest)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    }
}
